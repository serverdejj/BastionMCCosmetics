# BASTION MC - Todos los textos, materiales, slots y precios son editables.
# Colores: &6, &l y HEX &#RRGGBB. Los degradados se escriben caracter por caracter.
# No se requieren mods ni resource packs.
settings:
  # El plugin solo permite usar cosmeticos en estos mundos.
  allowed-worlds: [Void, void, spawn]
  aura-period-ticks: 8
  balloon-period-ticks: 3
  # scoreboard: integra una puntuacion del scoreboard vanilla que YA exista.
  # internal: mantiene gemas propias en players.yml (valor predeterminado).
  gems-source: internal
  scoreboard-objective: gemas
  gems-label: '&#53DDFD&lGEMAS'
menus:
  main:
    title: '&#F3BB23&lBASTION &f| &eCosméticos'
    size: 27
    filler-material: BLACK_STAINED_GLASS_PANE
    sections:
      auras: {slot: 10, material: BLAZE_POWDER, name: '&#FFBD51&l✦ AURAS', lore: ['&7Partículas que te rodean.', '&eClic para explorar.']}
      balloons: {slot: 12, material: LEAD, name: '&#62D9FF&l✦ GLOBOS', lore: ['&7Un globo que te acompaña.', '&eClic para explorar.']}
      hats: {slot: 14, material: GOLDEN_HELMET, name: '&#FFD873&l✦ SOMBREROS', lore: ['&7Luce un sombrero especial.', '&eClic para explorar.']}
      pets: {slot: 16, material: WOLF_SPAWN_EGG, name: '&#AAAAAA&l✦ MASCOTAS', lore: ['&cPRÓXIMAMENTE', '&7Esta sección todavía no abre.']}
  categories:
    size: 36
    filler-material: GRAY_STAINED_GLASS_PANE
    back-slot: 31
    back-material: ARROW
    title-auras: '&#F3BB23&lBASTION &f| &6Auras'
    title-balloons: '&#F3BB23&lBASTION &f| &bGlobos'
    title-hats: '&#F3BB23&lBASTION &f| &eSombreros'
    lore:
      owned: ['&a✔ Desbloqueado', '&eClic izquierdo: equipar', '&cClic derecho: desequipar']
      equipped: ['&a✔ EQUIPADO', '&eClic izquierdo: equipar', '&cClic derecho: desequipar']
      purchasable: ['&bPrecio: &f%price% gemas', '&eClic izquierdo: comprar y equipar', '&cClic derecho: desequipar']
      insufficient: ['&cPrecio: %price% gemas', '&cNo tienes suficientes gemas', '&eClic izquierdo: intentar comprar']
      free: ['&aGRATIS: acceso especial', '&eClic izquierdo: reclamar y equipar', '&cClic derecho: desequipar']
cosmetics:
  auras:
    fire:
      slot: 10
      name: '&#FF9C52&lAura de fuego'
      material: BLAZE_POWDER
      price: 100
      particle: FLAME
      count: 7
      lore: ['&7Chispas de fuego alrededor de ti.']
    magic:
      slot: 13
      name: '&#C77DFF&lAura mágica'
      material: ENCHANTED_BOOK
      price: 175
      particle: ENCHANT
      count: 12
      lore: ['&7Energía arcana alrededor de ti.']
    hearts:
      slot: 16
      name: '&#FF6FA2&lAura de corazones'
      material: PINK_DYE
      price: 250
      particle: HEART
      count: 2
      lore: ['&7Pequeños corazones a tu alrededor.']
  balloons:
    red:
      slot: 10
      name: '&#FF6161&lGlobo rojo'
      material: RED_WOOL
      price: 120
      balloon-text: '&#FF5555⬤\n&7│'
      lore: ['&7Un globo rojo flotante.']
    blue:
      slot: 13
      name: '&#6ACBFF&lGlobo azul'
      material: LIGHT_BLUE_WOOL
      price: 180
      balloon-text: '&#55AAFF⬤\n&7│'
      lore: ['&7Un globo azul flotante.']
    gold:
      slot: 16
      name: '&#FFD75D&lGlobo dorado'
      material: GOLD_BLOCK
      price: 350
      balloon-text: '&#FFDA46⬤\n&7│'
      lore: ['&7Un globo dorado especial.']
  hats:
    crown:
      slot: 10
      name: '&#FFD15C&lCorona de oro'
      material: GOLDEN_HELMET
      price: 150
      helmet: GOLDEN_HELMET
      lore: ['&7Una corona digna de un rey.']
    turtle:
      slot: 13
      name: '&#66DD88&lSombrero de tortuga'
      material: TURTLE_HELMET
      price: 190
      helmet: TURTLE_HELMET
      lore: ['&7Un estilo marino.']
    pumpkin:
      slot: 16
      name: '&#FFB35C&lCalabaza traviesa'
      material: CARVED_PUMPKIN
      price: 85
      helmet: CARVED_PUMPKIN
      lore: ['&7Una calabaza para la cabeza.']
